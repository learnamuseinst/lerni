<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D141"/>
      <stop offset="100%" stop-color="#559922"/>
    </linearGradient>
    <linearGradient id="bearBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#469B14"/>
      <stop offset="100%" stop-color="#3B7E10"/>
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F8D8"/>
      <stop offset="100%" stop-color="#D0F0B5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#152B05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Main Bear Character -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Ears -->
    <!-- Left Ear -->
    <circle cx="170" cy="170" r="54" fill="#3B7E10"/>
    <circle cx="170" cy="170" r="32" fill="#E8F8D8"/>

    <!-- Right Ear -->
    <circle cx="342" cy="170" r="54" fill="#3B7E10"/>
    <circle cx="342" cy="170" r="32" fill="#E8F8D8"/>

    <!-- Head -->
    <ellipse cx="256" cy="265" rx="145" ry="130" fill="url(#bearBody)"/>

    <!-- Cheeks Blush -->
    <circle cx="165" cy="290" r="22" fill="#FFB4AB" opacity="0.8"/>
    <circle cx="347" cy="290" r="22" fill="#FFB4AB" opacity="0.8"/>

    <!-- Eyes -->
    <ellipse cx="195" cy="245" rx="14" ry="18" fill="#151E14"/>
    <circle cx="190" cy="240" r="5" fill="#FFFFFF"/>

    <ellipse cx="317" cy="245" rx="14" ry="18" fill="#151E14"/>
    <circle cx="312" cy="240" r="5" fill="#FFFFFF"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="256" cy="295" rx="60" ry="46" fill="url(#snoutGrad)"/>

    <!-- Nose -->
    <ellipse cx="256" cy="280" rx="20" ry="14" fill="#151E14"/>

    <!-- Gentle Smile -->
    <path d="M 238 300 Q 256 318 274 300" stroke="#151E14" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Sprout on Head -->
    <path d="M 256 135 Q 248 100 230 95 Q 250 85 256 135" fill="#A2EB68"/>
    <path d="M 256 135 Q 264 100 282 95 Q 262 85 256 135" fill="#80D141"/>
    <circle cx="256" cy="135" r="4" fill="#3B7E10"/>
  </g>
</svg>
